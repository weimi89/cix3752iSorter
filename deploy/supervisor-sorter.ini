; supervisor 設定（現場既有以 supervisor 管理 main_proj 時沿用；與 systemd 二擇一；由 install.sh supervisor 安裝）
; 副檔名一定是 .ini：現場 /etc/supervisor/supervisord.conf 只 include conf.d/*.ini
; __APP_USER__／__APP_DIR__ 由 install.sh 安裝時代入
; 一定要帶 --headless：沒有它程式會去開 Tauri 視窗，服務環境沒有顯示器就會反覆崩潰重啟
[program:cix3752i-sorter]
command=__APP_DIR__/sorter --headless --config __APP_DIR__/config.toml --data-dir __APP_DIR__/data
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
environment=RUST_LOG="info"
stdout_logfile=/var/log/supervisor/cix3752i-sorter.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
